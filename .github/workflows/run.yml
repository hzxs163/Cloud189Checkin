name: Cloud check in action
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: 35 2 * * *
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: user
    steps:
      - name: 🔀 random delay 0-300 seconds
        run: sleep $((RANDOM % 301))

      - name: 🔌 Check out code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 18
          cache: npm

      - name: 👾 Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV
      
      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .token
          key: ${{ runner.os }}-cache-token
          restore-keys: ${{ runner.os }}-cache-token-

      - name: 🔧 Init secrets
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          node -e "const fs=require('fs');const s=JSON.parse(process.env.ALL_SECRETS_JSON);fs.writeFileSync('.env',Object.entries(s).map(([k,v])=>k+'='+v).sort().join('\n'));console.log('.env written: '+Object.keys(s).length+' vars')"

      - name: 📡 Init dependencies
        run: npm install

      - name: 🚀 Run
        uses: nick-fields/retry@1c62e0697831d444be410bc770cc1576ab22de08
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start
      
      - name: 📹 Save cached Cookie
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .token
          key: ${{ runner.os }}-cache-token-${{ hashFiles('.token/*.json') }}

      - name: 🚗 Keep Running
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push
